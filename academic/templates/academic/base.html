{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Gestión Académica
        {% endblock %}
    </title>


    <!-- ==========================================
         BOOTSTRAP
         Se carga mediante CDN, no requiere instalación.
    =========================================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ==========================================
         CSS PROPIO DEL PROYECTO
    =========================================== -->
    <link
        rel="stylesheet"
        href="{% static 'academic/css/styles.css' %}"
    >

</head>


<body>


    <!-- ==========================================
         MENÚ DE NAVEGACIÓN
    =========================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <!-- Nombre del sistema -->
            <a
                class="navbar-brand fw-bold"
                href="{% url 'home' %}"
            >
                Gestión Académica
            </a>


            <!-- Botón para menú en pantallas pequeñas -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <div
                class="collapse navbar-collapse"
                id="menuPrincipal"
            >

                <ul class="navbar-nav ms-auto">

                    <!-- Inicio -->
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'home' %}"
                        >
                            Inicio
                        </a>
                    </li>


                    <!-- Asignaturas -->
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'courses' %}"
                        >
                            Asignaturas
                        </a>
                    </li>


                    <!-- Estudiantes -->
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'students' %}"
                        >
                            Estudiantes
                        </a>
                    </li>


                    <!-- Panel de Django -->
                    <li class="nav-item ms-lg-2">
                        <a
                            class="btn btn-light"
                            href="/admin/"
                        >
                            Panel de Administración
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- ==========================================
         CONTENIDO DE CADA PÁGINA
    =========================================== -->
    <main class="container py-5">

        {% block content %}
        {% endblock %}

    </main>



    <!-- ==========================================
         TOKEN CSRF
         Se utilizará para peticiones que modifiquen
         información mediante JavaScript.
    =========================================== -->
    <div style="display: none;">
        {% csrf_token %}
    </div>



    <!-- ==========================================
         JAVASCRIPT DE BOOTSTRAP
    =========================================== -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- ==========================================
         JAVASCRIPT PARTICULAR DE CADA PÁGINA
    =========================================== -->
    {% block scripts %}
    {% endblock %}


</body>

</html>
